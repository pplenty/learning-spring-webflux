name: PR D-day Labeler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 테스트용 (5분마다)
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  update-dday-label:
    runs-on: ubuntu-latest
    steps:
      - name: Update D-day labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const D_REGEX = /^D([+-]\d+)$/;

            // PR 목록 가져오기
            let prs = [];
            if (context.eventName === 'pull_request') {
              prs = [context.payload.pull_request];
            } else {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              prs = data;
            }

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);

              // 모든 D라벨 중 첫 번째 라벨 선택
              const dLabels = labels.filter(l => D_REGEX.test(l));
              if (dLabels.length === 0) continue;

              const baseLabel = dLabels[0];            // 예: "D-21"
              const n = parseInt(baseLabel.match(D_REGEX)[1], 10); // -21

              const nextN = n + 1;   // “감소” = 음수에서는 +1

              // 라벨 포맷화
              let nextLabel;
              if (nextN < 0) nextLabel = `D${nextN}`;         // 예: -20 → D-20
              else if (nextN === 0) nextLabel = `D-0`;        // 0은 D-0 유지
              else nextLabel = `D+${nextN}`;                  // 양수는 D+1

              console.log(`PR #${pr.number}: ${baseLabel} → ${nextLabel}`);

              // 기존 D라벨 제거 후, nextLabel 추가
              const filtered = labels.filter(l => !D_REGEX.test(l));
              filtered.push(nextLabel);

              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: filtered,
              });
            }