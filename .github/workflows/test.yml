name: PR D-day Labeler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  update-dday-label:
    runs-on: ubuntu-latest
    steps:
      - name: Update D-day labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const D_REGEX = /^D([+-]\d+\+?)$/;
            const DEPLOY_DATE_REGEX = /\[(\d{2})\/(\d{1,2})\/(\d{1,2})배포\]/;
            const MAX_DAYS = 14;

            // D-day 값에 따른 색상 반환
            function getLabelColor(daysLeft) {
              if (daysLeft < 0) return '6c757d';
              if (daysLeft === 0) return 'b60205';
              if (daysLeft === 1) return 'd73a4a';
              if (daysLeft === 2) return 'e36d76';
              if (daysLeft === 3) return 'ff6b6b';
              if (daysLeft <= 5) return 'ff8c42';
              if (daysLeft <= 7) return 'fbca04';
              if (daysLeft <= 10) return '0e8a16';
              if (daysLeft <= 14) return '1d76db';
              return '6e7681';
            }

            // 라벨 생성 또는 업데이트
            async function ensureLabelWithColor(name, daysLeft) {
              const color = getLabelColor(daysLeft);
              const absDay = Math.abs(daysLeft);
              const description = daysLeft >= 0 ? `${absDay}일 남음` : `${absDay}일 지남`;
              
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                await github.rest.issues.updateLabel({
                  owner, repo, name, color, description
                });
                console.log(`라벨 업데이트: ${name} (색상: #${color})`);
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner, repo, name, color, description
                  });
                  console.log(`라벨 생성: ${name} (색상: #${color})`);
                }
              }
            }

            // 날짜로부터 D라벨 생성
            function getDayLabel(targetDate) {
              const today = new Date();
              today.setHours(0, 0, 0, 0);
              
              const diffTime = targetDate - today;
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              
              if (diffDays > MAX_DAYS) return { label: `D-${MAX_DAYS}+`, days: MAX_DAYS + 1 };
              else if (diffDays > 0) return { label: `D-${diffDays}`, days: diffDays };
              else if (diffDays === 0) return { label: 'D-0', days: 0 };
              else if (diffDays >= -MAX_DAYS) return { label: `D+${Math.abs(diffDays)}`, days: diffDays };
              else return { label: `D+${MAX_DAYS}+`, days: -(MAX_DAYS + 1) };
            }

            // PR 제목에서 배포 날짜 추출
            function extractDeployDate(title) {
              const match = title.match(DEPLOY_DATE_REGEX);
              if (!match) return null;
              
              const [, year, month, day] = match;
              const fullYear = 2000 + parseInt(year, 10);
              const date = new Date(fullYear, parseInt(month, 10) - 1, parseInt(day, 10));
              
              // 유효한 날짜인지 확인
              if (isNaN(date.getTime())) return null;
              
              date.setHours(0, 0, 0, 0);
              return date;
            }

            // PR 목록 가져오기
            let prs = [];
            if (context.eventName === 'pull_request') {
              prs = [context.payload.pull_request];
            } else {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100
              });
              prs = data;
            }

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              const dLabels = labels.filter(l => D_REGEX.test(l));
              
              // PR 제목에서 배포 날짜 추출 시도
              const deployDate = extractDeployDate(pr.title);
              
              if (deployDate) {
                // ✅ 날짜 형식 있음 → D라벨 생성/업데이트
                const { label: targetLabel, days: daysLeft } = getDayLabel(deployDate);
                await ensureLabelWithColor(targetLabel, daysLeft);
                
                if (dLabels.length === 0 || !dLabels.includes(targetLabel)) {
                  console.log(`PR #${pr.number}: ${targetLabel} 적용 (제목 기반)`);
                  
                  const filtered = labels.filter(l => !D_REGEX.test(l));
                  filtered.push(targetLabel);
                  
                  await github.rest.issues.setLabels({
                    owner, repo, issue_number: pr.number, labels: filtered
                  });
                }
              } else {
                // ❌ 날짜 형식 없음 → D라벨 제거 (이벤트 종류 무관)
                if (dLabels.length > 0) {
                  console.log(`PR #${pr.number}: D라벨 제거 (제목에 날짜 형식 없음)`);
                  
                  const filtered = labels.filter(l => !D_REGEX.test(l));
                  
                  await github.rest.issues.setLabels({
                    owner, repo, issue_number: pr.number, labels: filtered
                  });
                }
              }
            }
