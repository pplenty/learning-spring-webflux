name: PR D-day Labeler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  update-dday-label:
    runs-on: ubuntu-latest
    steps:
      - name: Update D-day labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const D_REGEX = /^D([+-]\d+\+?)$/;  // + 기호 포함하도록 수정
            const DEPLOY_DATE_REGEX = /\[(\d{2})\/(\d{1,2})\/(\d{1,2})배포\]/;
            const MAX_DAYS = 14;  // 최대 표시 일수

            // 날짜로부터 D라벨 생성
            function getDayLabel(targetDate) {
              const today = new Date();
              today.setHours(0, 0, 0, 0);
              
              const diffTime = targetDate - today;
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              
              // D-14+ ~ D+14+ 범위로 제한
              if (diffDays > MAX_DAYS) return `D-${MAX_DAYS}+`;       // 15일 이상 남음
              else if (diffDays > 0) return `D-${diffDays}`;          // 1~14일 남음
              else if (diffDays === 0) return 'D-0';                  // 오늘
              else if (diffDays >= -MAX_DAYS) return `D+${Math.abs(diffDays)}`; // 1~14일 지남
              else return `D+${MAX_DAYS}+`;                           // 15일 이상 지남
            }

            // PR 제목에서 배포 날짜 추출
            function extractDeployDate(title) {
              const match = title.match(DEPLOY_DATE_REGEX);
              if (!match) return null;
              
              const [, year, month, day] = match;
              const fullYear = 2000 + parseInt(year, 10);
              const date = new Date(fullYear, parseInt(month, 10) - 1, parseInt(day, 10));
              date.setHours(0, 0, 0, 0);
              
              return date;
            }

            // PR 목록 가져오기
            let prs = [];
            if (context.eventName === 'pull_request') {
              prs = [context.payload.pull_request];
            } else {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              prs = data;
            }

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              const dLabels = labels.filter(l => D_REGEX.test(l));
              
              // 1. PR 제목에서 배포 날짜 자동 인식
              const deployDate = extractDeployDate(pr.title);
              
              if (deployDate) {
                const targetLabel = getDayLabel(deployDate);
                
                if (dLabels.length === 0 || !dLabels.includes(targetLabel)) {
                  console.log(`PR #${pr.number}: 배포일 기반 라벨 생성 → ${targetLabel}`);
                  
                  const filtered = labels.filter(l => !D_REGEX.test(l));
                  filtered.push(targetLabel);
                  
                  await github.rest.issues.setLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: filtered,
                  });
                }
                continue;
              }
              
              // 2. 기존 D라벨 하루씩 증가
              if (dLabels.length === 0) continue;

              const baseLabel = dLabels[0];
              
              // D-14+나 D+14+ 같은 경계 라벨은 그대로 유지
              if (baseLabel.endsWith('+')) {
                console.log(`PR #${pr.number}: ${baseLabel} 유지 (경계값)`);
                continue;
              }

              const match = baseLabel.match(/^D([+-]?\d+)$/);
              if (!match) continue;
              
              const n = parseInt(match[1], 10);
              const nextN = n + 1;

              let nextLabel;
              if (nextN > MAX_DAYS) nextLabel = `D-${MAX_DAYS}+`;
              else if (nextN > 0) nextLabel = `D-${nextN}`;
              else if (nextN === 0) nextLabel = 'D-0';
              else if (nextN >= -MAX_DAYS) nextLabel = `D+${Math.abs(nextN)}`;
              else nextLabel = `D+${MAX_DAYS}+`;

              console.log(`PR #${pr.number}: ${baseLabel} → ${nextLabel}`);

              const filtered = labels.filter(l => !D_REGEX.test(l));
              filtered.push(nextLabel);

              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: filtered,
              });
            }