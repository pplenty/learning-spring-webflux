name: PR D-day Labeler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # 테스트용 (5분마다)
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  update-dday-label:
    runs-on: ubuntu-latest
    steps:
      - name: Update D-day labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const D_PREFIX = 'D';
            const D_REGEX = /^D([+-]\d+)$/;  // D-10, D+3 등 파싱

            // PR 목록
            let prs = [];
            if (context.eventName === 'pull_request') {
              prs = [context.payload.pull_request];
            } else {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              prs = data;
            }

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);

              // 모든 D label 추출
              const dLabels = labels.filter(l => D_REGEX.test(l));

              if (dLabels.length === 0) {
                // D 라벨이 없으면 이 PR은 관리 대상 아님
                continue;
              }

              // 가장 큰 D값을 기준으로 사용
              // 예: ["D-10", "D-5"] -> -5가 더 크므로 -5 기준
              const dNumbers = dLabels.map(l => parseInt(l.match(D_REGEX)[1], 10));
              const maxD = Math.max(...dNumbers);

              console.log(`PR #${pr.number} current max D = ${maxD}`);

              // 하루에 1번만 줄이기 (지금은 테스트를 위해 주석 처리)
              /*
              const today = new Date().toISOString().split("T")[0]; 
              const commentKey = `D-DAY-LAST-RUN:${today}`;

              // 이미 오늘 실행됨?
              const comments = await github.rest.issues.listComments({
                owner, repo, issue_number: pr.number
              });
              const alreadyRunToday = comments.data.some(c => c.body === commentKey);
              if (alreadyRunToday) {
                console.log(`PR #${pr.number} already updated today. Skip.`);
                continue;
              }
              */

              // 다음 값은 -1 감소
              const nextD = maxD - 1;

              console.log(`PR #${pr.number}: ${maxD} → ${nextD}`);

              // 기존 라벨에서 모든 D라벨 제거
              const nonDLabels = labels.filter(l => !D_REGEX.test(l));

              // nextD 라벨 추가
              const nextLabel = `D${nextD >= 0 ? "+" + nextD : nextD}`;
              // D0일 때 D+0? → 너가 정의한 기준은 D-0 → 0을 기준으로 나눔  
              // nextD = 0이면 → D-0으로 가야 함 (요구사항)
              const finalLabel = (nextD === 0) ? "D-0" : nextLabel;

              nonDLabels.push(finalLabel);

              console.log(`PR #${pr.number} → attaching label ${finalLabel}`);

              // 라벨 업데이트
              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: nonDLabels,
              });

              // 하루에 1회만 실행한 것 표시 (현재는 주석)
              /*
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: commentKey
              });
              */
            }